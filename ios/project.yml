name: Marquee
options:
  bundleIdPrefix: com.marquee
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_CFBundleDisplayName: Marquee
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.marquee.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Marquee:
    type: application
    platform: iOS
    sources:
      - path: Marquee
    dependencies:
      - target: MarqueeWidgets
        embed: true
    postCompileScripts:
      - name: Bundle dotenv
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/.env"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/.env"
          if [ -f "$SRC" ]; then
            mkdir -p "$(dirname "$DEST")"
            cp "$SRC" "$DEST"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimil.marquee
        DEVELOPMENT_TEAM: DWXW4WF2VQ
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Marquee/Marquee.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Marquee uses your photo library so you can set a profile picture.
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Marquee/Marquee.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Marquee/MarqueeRelease.entitlements
    info:
      path: Marquee/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        API_BASE_URL: https://marquee-4kjw.onrender.com
        GIDClientID: 375100697427-dk86bn82i5edmfd1m82u1uc05o2dq3h5.apps.googleusercontent.com
        GIDServerClientID: 375100697427-oahuj0bruvllnjg2safa4igmnthuihmm.apps.googleusercontent.com
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.375100697427-dk86bn82i5edmfd1m82u1uc05o2dq3h5
  MarqueeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MarqueeWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimil.marquee.widgets
        DEVELOPMENT_TEAM: DWXW4WF2VQ
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MarqueeWidgets/MarqueeWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
        INFOPLIST_KEY_CFBundleDisplayName: Marquee Widgets
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: MarqueeWidgets
    info:
      path: MarqueeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Marquee Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  MarqueeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MarqueeTests
    dependencies:
      - target: Marquee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimil.marquee.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: DWXW4WF2VQ
        CODE_SIGN_STYLE: Automatic
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Marquee.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Marquee
  MarqueeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MarqueeUITests
    dependencies:
      - target: Marquee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimil.marquee.uitests
        TEST_TARGET_NAME: Marquee
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: DWXW4WF2VQ
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    info:
      path: MarqueeUITests/Info.plist
      properties:
        CFBundleDisplayName: Marquee
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSupportsIndirectInputEvents: true
schemes:
  Marquee:
    build:
      targets:
        Marquee: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarqueeTests
        - MarqueeUITests
