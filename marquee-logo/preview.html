<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font-family:system-ui,sans-serif;margin:0;padding:40px;background:#0d0d14;color:#f6f3ec}
.row{display:flex;gap:48px;align-items:center;margin:32px 0;flex-wrap:wrap}
.card{padding:32px;border-radius:16px;display:flex;gap:24px;align-items:center}
.light{background:#f4f1ea}
.dark{background:#16161f}
img{width:96px;height:96px}
.lockup{width:auto;height:56px}
h2{font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#8a8a96;margin:40px 0 0}
</style></head><body>
<h1 style="font-size:22px">Marquee logo — preview</h1>
<h2>App icon (dark panel)</h2>
<div class="row"><div class="card light"><img src="marquee-icon.svg"></div>
<div class="card dark"><img src="marquee-icon.svg"></div></div>
<h2>Standalone mark</h2>
<div class="row"><div class="card light"><img src="marquee-mark-dark.svg"></div>
<div class="card dark"><img src="marquee-mark-light.svg"></div></div>
<h2>Lockup (icon + wordmark)</h2>
<div class="row"><div class="card light"><img class="lockup" src="marquee-lockup-dark.svg"></div>
<div class="card dark"><img class="lockup" src="marquee-lockup-light.svg"></div></div>
</body></html>
